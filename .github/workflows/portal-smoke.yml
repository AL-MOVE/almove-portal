name: Portal smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar portal publicado
        env:
          PORTAL_BASE_URL: https://almove-portal.vercel.app
          PORTAL_TEST_TOKEN: ${{ secrets.PORTAL_TEST_TOKEN }}
        run: node tests/portal-smoke.mjs
