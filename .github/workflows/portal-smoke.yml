name: Portal smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar contratos locais
        run: |
          node tests/hotfix-contracts.mjs
          node tests/perfil-contracts.mjs
          node tests/api-contracts.mjs
      - name: Testar portal publicado
        env:
          PORTAL_BASE_URL: https://portal.almove.pt
          PORTAL_TEST_EMAIL: ${{ secrets.PORTAL_TEST_EMAIL }}
        run: node tests/portal-smoke.mjs
