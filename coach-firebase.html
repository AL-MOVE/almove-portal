<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AL MOVE · CRM Development</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#e7edf5;background:#06111e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#0e3857,#06111e 48%)}.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.side{padding:24px 14px;background:#07111c;border-right:1px solid #213244}.brand{font-weight:800;font-size:18px;margin:0 10px 30px}.brand small{display:block;color:#2dd4bf;font-size:10px;letter-spacing:.12em}.group{color:#718096;font-size:10px;font-weight:800;letter-spacing:.12em;margin:22px 10px 8px}.nav{display:block;width:100%;border:0;border-radius:10px;background:none;color:#b9c5d4;text-align:left;padding:11px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.nav:hover,.nav.active{background:#10383a;color:#2dd4bf}.main{padding:28px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.eyebrow{font-size:11px;color:#2dd4bf;font-weight:800;letter-spacing:.12em}.title{font-size:30px;margin:5px 0}.sub{color:#91a3b8}.button{border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(135deg,#2dd4bf,#0785df);color:#03211e;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.client{border:1px solid #27445d;border-radius:16px;background:#0a1b2b;padding:18px}.card span{display:block;color:#93a5b8;font-size:11px;font-weight:800}.card strong{font-size:27px}.clients{display:grid;gap:12px}.client{display:flex;justify-content:space-between;align-items:center;cursor:pointer}.client:hover{border-color:#2dd4bf}.badge{border:1px solid #147a70;color:#5eead4;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.muted{color:#91a3b8}.hidden{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:flex;gap:4px;overflow:auto;padding:12px}.brand,.group{display:none}.nav{white-space:nowrap}.main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}}</style><body><div class="app"><aside class="side"><div class="brand">AL MOVE<small>CRM DEVELOPMENT</small></div><button class="nav active" data-view="dashboard">Dashboard</button><button class="nav" data-view="clientes">Clientes</button><button class="nav" data-view="inativos">Clientes inativos</button><div class="group">GESTÃO</div><button class="nav" data-view="pagamentos">Pagamentos</button><button class="nav" data-view="checkins">Check-ins</button></aside><main class="main"><div class="top"><div><div class="eyebrow">AL MOVE · CRM</div><h1 class="title" id="titulo">Visão geral</h1><div class="sub" id="estado">A ligar ao Firebase…</div></div><button class="button" id="atualizar">Atualizar</button></div><section id="dashboard"><div class="grid" id="metricas"></div></section><section id="clientes" class="hidden"><div class="clients" id="lista"></div></section><section id="detalhe" class="hidden"><button class="nav" id="voltar">← Voltar a clientes</button><div id="ficha"></div></section><section id="vazio" class="hidden"><div class="card"><strong>Em preparação</strong><p class="muted">Esta secção será ligada ao Firebase depois de Clientes.</p></div></section></main></div><script src="/js/firebase-config.js"></script><script src="/js/firebase-sdk.js"></script><script src="/js/firebase-auth.js"></script><script>let token='',crm=null;const q=s=>document.querySelector(s);function mostrar(id){['dashboard','clientes','detalhe','vazio'].forEach(x=>q('#'+x).classList.toggle('hidden',x!==id));}async function api(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Não foi possível carregar.');return d}function euro(n){return new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0))}function render(){const d=crm.dashboard;q('#metricas').innerHTML=[['Clientes ativos',d.clientesAtivos],['Sessões este mês',d.sessoesConfirmadas+' / '+d.sessoesTotal],['Receita recebida',euro(d.recebido)],['Receita pendente',euro(d.pendente)]].map(x=>'<article class="card"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></article>').join('');q('#lista').innerHTML=crm.clientes.filter(c=>c.estado==='Ativo').sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(c=>'<article class="client" data-id="'+c.id+'"><div><strong>'+c.nome+'</strong><div class="muted">'+(c.contacto||'Sem contacto')+'</div></div><span class="badge">'+c.estado+'</span></article>').join('');document.querySelectorAll('.client').forEach(e=>e.onclick=()=>ficha(e.dataset.id));}async function ficha(id){q('#estado').textContent='A carregar cliente…';const d=await api('/api/dev-crm-client-detail?id='+encodeURIComponent(id));const c=d.detalhe.cliente,p=d.detalhe.packAtivo;q('#titulo').textContent=c.nome;q('#ficha').innerHTML='<article class="card"><h2>'+c.nome+'</h2><p class="muted">'+c.estado+' · '+(p?p.frequencia:'Sem pack ativo')+'</p><div class="grid"><div><span>SESSÕES</span><strong>'+c.totalSessoesConfirmadas+'</strong></div><div><span>PLANOS</span><strong>'+c.numPlanosTreino+'</strong></div><div><span>NOTAS</span><strong>'+d.notas.length+'</strong></div><div><span>ATIVIDADE</span><strong>'+d.atividade.length+'</strong></div></div></article>';mostrar('detalhe');q('#estado').textContent='Firebase Development · atualizado';}async function iniciar(){try{const c=await ALMOVE_FIREBASE_CONFIG.obter();await AlMoveFirebaseAuth.configurar(c);for(let i=0;i<30&&!token;i++){token=await AlMoveFirebaseAuth.token();if(!token)await new Promise(r=>setTimeout(r,200));}if(!token)throw Error('Entra primeiro em dev-crm.html.');crm=(await api('/api/dev-crm-dashboard')).crm;render();q('#estado').textContent='Firebase Development · dados sincronizados'}catch(e){q('#estado').textContent=e.message}}document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#titulo').textContent=b.textContent;mostrar(['dashboard','clientes'].includes(b.dataset.view)?b.dataset.view:'vazio')});q('#atualizar').onclick=iniciar;q('#voltar').onclick=()=>{q('#titulo').textContent='Clientes';mostrar('clientes')};iniciar();</script></body></html>
