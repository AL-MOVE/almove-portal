<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07121d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach AM">
  <link rel="manifest" href="/coach-mobile-manifest.json">
  <link rel="apple-touch-icon" href="/icons/coach-192.png">
  <title>André Martins · Coach</title>
  <style>
    :root { color-scheme:dark; --bg:#07121d; --panel:#0d1b2b; --panel-strong:#10253a; --line:#26415a; --text:#eef7ff; --muted:#91a3b8; --teal:#22d3c5; --blue:#1677e8; --warn:#fbbf24; --danger:#fb7185; --safe:#55d98c; --radius:18px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100dvh; margin:0; color:var(--text); background:radial-gradient(90% 48% at 10% -5%,rgba(6,112,148,.5),transparent 66%),radial-gradient(74% 44% at 100% 33%,rgba(12,100,91,.24),transparent 70%),var(--bg); }
    button,input,select,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(34,211,197,.48); outline-offset:2px; }
    .app { width:min(100%,600px); min-height:100dvh; margin:0 auto; background:linear-gradient(145deg,rgba(7,18,29,.82),rgba(4,13,23,.7)); border-inline:1px solid rgba(148,163,184,.16); box-shadow:0 24px 70px rgba(0,0,0,.24); }
    .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:72px; padding:calc(env(safe-area-inset-top) + 12px) 18px 12px; border-bottom:1px solid rgba(148,163,184,.18); background:rgba(7,18,29,.72); backdrop-filter:blur(22px) saturate(130%); }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand img { width:33px; height:33px; object-fit:contain; flex:none; }
    .brand strong { display:block; overflow:hidden; font-size:13px; line-height:1.1; text-overflow:ellipsis; white-space:nowrap; }
    .brand small { display:block; margin-top:4px; color:var(--teal); font-size:10px; font-weight:800; letter-spacing:.09em; }
    .icon-button { display:grid; width:40px; height:40px; place-items:center; border:1px solid var(--line); border-radius:13px; color:var(--text); background:#122032; }
    .icon-button svg { width:19px; height:19px; }
    main { min-height:calc(100dvh - 72px); padding:20px 16px calc(92px + env(safe-area-inset-bottom)); }
    .eyebrow { margin:0 0 6px; color:var(--teal); font-size:11px; font-weight:900; letter-spacing:.11em; text-transform:uppercase; }
    h1 { margin:0; font-size:27px; letter-spacing:-.04em; line-height:1.08; }
    h2 { margin:0; font-size:17px; letter-spacing:-.02em; }
    p { margin:0; }
    .subtitle { margin-top:8px; color:var(--muted); font-size:13px; line-height:1.45; }
    .stack { display:grid; gap:12px; margin-top:20px; }
    .card { border:1px solid rgba(105,156,189,.32); border-radius:var(--radius); background:linear-gradient(145deg,rgba(31,62,86,.57),rgba(9,21,34,.72)); box-shadow:inset 0 1px rgba(255,255,255,.05),0 15px 42px rgba(0,0,0,.17); backdrop-filter:blur(15px) saturate(125%); }
    .card-inner { padding:16px; }
    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .metric { min-height:105px; padding:14px; border:1px solid rgba(105,156,189,.27); border-radius:15px; background:rgba(11,31,48,.48); backdrop-filter:blur(13px); }
    .metric strong { display:block; margin-top:10px; font-size:25px; letter-spacing:-.04em; }
    .metric span { display:block; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
    .metric em { display:block; margin-top:5px; color:#a8bdcc; font-size:11px; font-style:normal; }
    .metric-accent { border-color:rgba(34,211,197,.34); background:linear-gradient(135deg,rgba(12,120,125,.3),rgba(13,37,59,.85)); }
    .section-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:24px 1px 10px; }
    .section-heading button { color:var(--teal); background:transparent; font-size:12px; font-weight:800; }
    .list { overflow:hidden; }
    .list-row { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:71px; padding:13px 15px; border-bottom:1px solid rgba(148,163,184,.12); color:var(--text); text-align:left; background:transparent; }
    .list-row:last-child { border-bottom:0; }
    .list-row:active { background:rgba(34,211,197,.08); }
    .list-main { min-width:0; }
    .list-main strong { display:block; overflow:hidden; font-size:14px; text-overflow:ellipsis; white-space:nowrap; }
    .list-main span { display:block; margin-top:4px; overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .list-side { display:grid; justify-items:end; gap:5px; flex:none; color:var(--muted); font-size:11px; }
    .amount { color:var(--teal); font-size:15px; font-weight:900; }
    .badge { display:inline-flex; align-items:center; min-height:24px; padding:0 9px; border:1px solid rgba(148,163,184,.26); border-radius:999px; color:#d4e4ee; background:rgba(148,163,184,.1); font-size:11px; font-weight:800; white-space:nowrap; }
    .badge.warn { border-color:rgba(251,191,36,.56); color:#fcd66d; background:rgba(251,191,36,.1); }
    .badge.safe { border-color:rgba(85,217,140,.5); color:#7de6aa; background:rgba(85,217,140,.1); }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:46px; gap:8px; padding:0 16px; border-radius:13px; color:#031b22; background:linear-gradient(110deg,var(--teal),#1685ea); font-size:13px; font-weight:900; }
    .button svg { width:18px; height:18px; flex:none; }
    .button.secondary { border:1px solid var(--line); color:#dcebf5; background:#152438; }
    .button.danger { color:#fff; background:#b42343; }
    .button.full { width:100%; }
    .quick-action { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:15px; border:1px solid rgba(34,211,197,.3); border-radius:var(--radius); color:var(--text); text-align:left; background:linear-gradient(130deg,rgba(10,117,121,.32),rgba(13,36,55,.9)); }
    .quick-action strong { display:block; font-size:14px; }
    .quick-action span { display:block; margin-top:4px; color:#b5d9d9; font-size:12px; }
    .quick-action svg { width:22px; height:22px; color:var(--teal); flex:none; }
    .empty { padding:26px 16px; color:var(--muted); font-size:13px; line-height:1.5; text-align:center; }
    .notice { display:flex; align-items:flex-start; gap:9px; margin-bottom:14px; padding:12px; border:1px solid rgba(251,191,36,.42); border-radius:13px; color:#f9d87b; background:rgba(251,191,36,.08); font-size:12px; line-height:1.45; }
    .notice svg { width:18px; height:18px; flex:none; }
    .status { display:none; margin-bottom:14px; padding:11px 12px; border:1px solid rgba(148,163,184,.26); border-radius:12px; color:#c5d9e8; background:rgba(20,40,61,.75); font-size:12px; line-height:1.4; }
    .status.show { display:block; }
    .status.error { border-color:rgba(251,113,133,.55); color:#fecdd3; background:rgba(159,18,57,.16); }
    .status.ok { border-color:rgba(85,217,140,.46); color:#b7f3cf; background:rgba(22,101,52,.18); }
    .bottom-nav { position:fixed; right:0; bottom:0; left:0; z-index:30; display:flex; width:min(100%,600px); min-height:72px; margin:auto; padding:8px 7px calc(8px + env(safe-area-inset-bottom)); border:1px solid rgba(148,163,184,.16); border-bottom:0; border-radius:22px 22px 0 0; background:rgba(7,18,29,.96); backdrop-filter:blur(18px); box-shadow:0 -14px 36px rgba(0,0,0,.26); }
    .nav-button { display:grid; flex:1; place-items:center; gap:3px; min-width:0; border-radius:13px; color:#8fa1b6; background:transparent; font-size:10px; font-weight:800; }
    .nav-button svg { width:19px; height:19px; }
    .nav-button.active { color:var(--teal); background:rgba(34,211,197,.11); }
    .back { display:inline-flex; align-items:center; gap:6px; padding:0; color:var(--teal); background:transparent; font-size:12px; font-weight:900; }
    .back svg { width:17px; height:17px; }
    .profile-hero { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:17px; }
    .avatar { display:grid; width:50px; height:50px; place-items:center; border-radius:50%; color:#eaffff; background:linear-gradient(145deg,var(--teal),var(--blue)); font-size:18px; font-weight:900; }
    .profile-hero strong { font-size:19px; }
    .profile-hero span { display:block; margin-top:4px; overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .field { display:grid; min-width:0; gap:6px; }
    .field label { color:#b9c9d8; font-size:11px; font-weight:800; }
    .field input,.field select,.field textarea { width:100%; max-width:100%; min-height:43px; border:1px solid #355069; border-radius:11px; padding:10px 11px; color:var(--text); background:#0a1929; }
    .field textarea { min-height:69px; resize:vertical; }
    .fields { display:grid; gap:10px; }
    .fields.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .fields.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .client-facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:14px; }
    .fact { padding:11px; border:1px solid rgba(148,163,184,.16); border-radius:12px; background:rgba(7,18,29,.5); }
    .fact span { display:block; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .fact strong { display:block; margin-top:5px; overflow:hidden; font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
    .session-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .session-timer { color:var(--teal); font-size:13px; font-weight:900; }
    .exercise { min-width:0; padding:16px; border:1px solid rgba(105,156,189,.3); border-radius:16px; background:linear-gradient(145deg,rgba(7,22,36,.72),rgba(16,40,59,.52)); box-shadow:inset 0 1px rgba(255,255,255,.035); }
    .exercise + .exercise { margin-top:10px; }
    .exercise h3 { margin:0; font-size:14px; }
    .exercise p { margin-top:4px; color:var(--muted); font-size:11px; }
    .series { display:grid; grid-template-columns:32px repeat(3,minmax(0,1fr)); gap:8px; align-items:end; margin-top:13px; padding:10px; border:1px solid rgba(105,156,189,.21); border-radius:13px; background:rgba(2,12,22,.32); }
    .series b { align-self:center; color:var(--teal); font-size:13px; font-weight:900; text-align:center; }
    .series .field label { font-size:9px; }
    .series .field input,.series .field select { min-height:38px; padding:7px; font-size:12px; }
    .series-intensity { min-width:0; }
    .series-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
    .text-button { min-height:34px; padding:0 10px; border:1px solid var(--line); border-radius:10px; color:#dcebf5; background:#152438; font-size:11px; font-weight:850; }
    .text-button.danger { border-color:rgba(251,113,133,.46); color:#fecdd3; background:rgba(159,18,57,.16); }
    .exercise-original { margin-top:5px !important; color:#7ca6b7 !important; }
    .scale-help { margin:8px 0 0; color:#7ca6b7; font-size:11px; line-height:1.4; }
    .plan-save-option { display:flex; align-items:flex-start; gap:9px; margin-top:14px; padding:12px; border:1px solid rgba(34,211,197,.22); border-radius:12px; background:rgba(34,211,197,.06); color:#cfe5ee; font-size:12px; line-height:1.4; }
    .plan-save-option input { width:17px; height:17px; margin:1px 0 0; accent-color:var(--teal); flex:none; }
    .session-danger { margin-top:12px; }
    .confirm-layer { position:fixed; inset:0; z-index:50; display:grid; align-items:end; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); background:rgba(1,7,14,.68); backdrop-filter:blur(5px); }
    .confirm-sheet { width:min(100%,568px); margin:auto; padding:20px; border:1px solid rgba(251,113,133,.38); border-radius:20px; background:linear-gradient(145deg,#16263a,#0a1726); box-shadow:0 24px 64px rgba(0,0,0,.48); }
    .confirm-sheet h2 { font-size:19px; }
    .confirm-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:17px; }
    .divider { height:1px; margin:17px 0; background:rgba(148,163,184,.15); }
    .spinner { display:grid; min-height:45vh; place-items:center; color:var(--muted); font-size:13px; }
    .hidden { display:none !important; }
    @media (min-width:700px) { .app { min-height:100dvh; box-shadow:0 0 0 1px rgba(148,163,184,.1),0 32px 90px rgba(0,0,0,.35); } }
    @media (max-width:460px) { main { padding-inline:12px; } .topbar { padding-inline:14px; } .summary { gap:8px; } .metric { padding:12px; } .metric strong { font-size:22px; } .fields.two,.fields.three { grid-template-columns:1fr; } .series { grid-template-columns:25px minmax(0,1fr) minmax(0,1fr); } .series-intensity { grid-column:2 / -1; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="/icons/coach-192.png" alt="André Martins"><div><strong>André Martins</strong><small>PERSONAL TRAINER · COACH</small></div></div>
      <button class="icon-button" id="refreshButton" type="button" aria-label="Atualizar dados" title="Atualizar dados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.6 6"/><path d="M3 12A9 9 0 0 1 18.6 6"/><path d="M3 17v-5h5"/><path d="M21 7v5h-5"/></svg></button>
    </header>
    <main id="main"><div class="spinner">A preparar a App Coach…</div></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navegação principal">
      <button class="nav-button active" data-view="home" type="button" aria-label="Hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="8" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Hoje</span></button>
      <button class="nav-button" data-view="agenda" type="button" aria-label="Agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>Agenda</span></button>
      <button class="nav-button" data-view="clients" type="button" aria-label="Clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Clientes</span></button>
      <button class="nav-button" data-view="alerts" type="button" aria-label="Alertas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span>Alertas</span></button>
      <button class="nav-button" data-view="profile" type="button" aria-label="Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span></button>
    </nav>
  </div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-sdk.js"></script>
  <script src="/js/firebase-auth.js"></script>
  <script src="/js/firebase-crm-session.js"></script>
  <script>
  (function () {
    'use strict';
    const main = document.getElementById('main');
    const state = { view: 'home', context: null, crm: null, agenda: null, checkins: null, ptMonth: null, weekOffset: 0, selected: null, session: null, loading: false };
    const svg = {
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 2.9 1.8 17a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 2.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>'
    };
    function el(tag, options, children) { const node = document.createElement(tag); const attrs = options || {}; Object.keys(attrs).forEach(function (key) { if (key === 'className') node.className = attrs[key]; else if (key === 'text') node.textContent = attrs[key]; else if (key === 'html') node.innerHTML = attrs[key]; else if (key === 'type') node.type = attrs[key]; else if (key === 'value') node.value = attrs[key]; else if (key === 'checked') node.checked = Boolean(attrs[key]); else if (key === 'disabled') node.disabled = Boolean(attrs[key]); else node.setAttribute(key, attrs[key]); }); (children || []).forEach(function (child) { if (child) node.append(child); }); return node; }
    function euro(valor) { return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(Number(valor || 0)); }
    function number(valor) { return Number(valor || 0); }
    function dateLisbon() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Lisbon', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
    function timeNow() { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()); }
    function greet() { const hour = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Lisbon', hour: 'numeric', hourCycle: 'h23' }).format(new Date())); return hour < 12 ? 'Bom dia' : hour < 19 ? 'Boa tarde' : 'Boa noite'; }
    function initials(value) { return String(value || 'AM').split(/\s+/).filter(Boolean).slice(0, 2).map(function (part) { return part[0]; }).join('').toUpperCase(); }
    function status(message, kind) { const box = document.getElementById('status'); if (!box) return; box.className = 'status show' + (kind ? ' ' + kind : ''); box.textContent = message; }
    function clearStatus() { const box = document.getElementById('status'); if (box) { box.className = 'status'; box.textContent = ''; } }
    function setContent(nodes) { main.replaceChildren(); nodes.forEach(function (node) { main.append(node); }); window.scrollTo({ top: 0, behavior: 'auto' }); }
    function title(eyebrow, heading, subtitle) { const block = el('section'); block.append(el('p', { className: 'eyebrow', text: eyebrow }), el('h1', { text: heading })); if (subtitle) block.append(el('p', { className: 'subtitle', text: subtitle })); return block; }
    function card(children, className) { return el('section', { className: 'card' + (className ? ' ' + className : '') }, [el('div', { className: 'card-inner' }, children)]); }
    function button(text, options) { const node = el('button', { className: 'button' + (options && options.kind ? ' ' + options.kind : '') + (options && options.full ? ' full' : ''), type: 'button', text: text }); if (options && options.icon) node.innerHTML = options.icon + '<span>' + text + '</span>'; if (options && options.action) node.addEventListener('click', options.action); return node; }
    async function api(path, options) { const token = await window.AlMoveFirebaseAuth.token(true); const response = await fetch(path, { method: (options && options.method) || 'GET', headers: Object.assign({ Authorization: 'Bearer ' + token }, (options && options.headers) || {}), body: options && options.body, cache: 'no-store', credentials: 'same-origin' }); let data = null; try { data = await response.json(); } catch (error) { throw new Error('Resposta inválida do servidor.'); } if (!response.ok || !data || data.ok === false) { if (response.status === 401 || response.status === 403) location.replace('/dev-crm.html?next=' + encodeURIComponent('/coach-mobile.html')); throw new Error((data && data.erro) || 'Não foi possível concluir esta operação.'); } return data; }
    async function loadDashboard() { const data = await api('/api/dev-crm-dashboard'); state.crm = data.crm; return data.crm; }
    async function loadAgenda() { const data = await api('/api/dev-crm-agenda?offset=' + encodeURIComponent(state.weekOffset)); state.agenda = data; return data; }
    async function loadPTMonth() { const data = await api('/api/dev-crm-agenda?mode=monthly-pt'); state.ptMonth = data; return data; }
