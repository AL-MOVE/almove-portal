  <style>
    :root { color-scheme:dark; --bg:#07121d; --panel:#0d1b2b; --panel-strong:#10253a; --line:#26415a; --text:#eef7ff; --muted:#91a3b8; --teal:#22d3c5; --blue:#1677e8; --warn:#fbbf24; --danger:#fb7185; --safe:#55d98c; --radius:18px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }

    body { min-width:320px; min-height:100dvh; margin:0; color:var(--text); background:radial-gradient(90% 48% at 10% -5%,rgba(6,112,148,.5),transparent 66%),radial-gradient(74% 44% at 100% 33%,rgba(12,100,91,.24),transparent 70%),var(--bg); }
    button,input,select,textarea { font:inherit; }

    .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:72px; padding:calc(env(safe-area-inset-top) + 12px) 18px 12px; border-bottom:1px solid rgba(148,163,184,.18); background:rgba(7,18,29,.72); backdrop-filter:blur(22px) saturate(130%); }

    .brand small { display:block; margin-top:4px; color:var(--teal); font-size:10px; font-weight:800; letter-spacing:.09em; }
    .icon-button { display:grid; width:40px; height:40px; place-items:center; border:1px solid var(--line); border-radius:13px; color:var(--text); background:#122032; }
    .icon-button svg { width:19px; height:19px; }
    main { min-height:calc(100dvh - 72px); padding:20px 16px calc(92px + env(safe-area-inset-bottom)); }

    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }

    .back { display:inline-flex; align-items:center; gap:6px; padding:0; color:var(--teal); background:transparent; font-size:12px; font-weight:900; }
    .back svg { width:17px; height:17px; }
    .profile-hero { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; padding:17px; }
    .avatar { display:grid; width:50px; height:50px; place-items:center; border-radius:50%; color:#eaffff; background:linear-gradient(145deg,var(--teal),var(--blue)); font-size:18px; font-weight:900; }

    .exercise { min-width:0; padding:16px; border:1px solid rgba(105,156,189,.3); border-top:2px solid rgba(34,211,197,.38); border-radius:16px; background:linear-gradient(145deg,rgba(7,22,36,.82),rgba(16,40,59,.58)); box-shadow:inset 0 1px rgba(255,255,255,.045),0 10px 28px rgba(0,0,0,.12); backdrop-filter:blur(14px) saturate(118%); transition:border-color .2s ease,box-shadow .2s ease; }

    .text-button { min-height:34px; padding:0 10px; border:1px solid var(--line); border-radius:10px; color:#dcebf5; background:#152438; font-size:11px; font-weight:850; }

    function renderAlerts() { const root = [title('ALERTAS', 'Acompanhar pendências', 'Pagamentos por receber, atrasos e check-ins do dia.'), buildStatus()]; const pending = state.crm.pagamentosPendentes || []; const late = state.crm.clientesEmAtraso || []; root.push(el('div', { className: 'summary stack' }, [metric('Por receber', euro(state.crm.dashboard.pendente), pending.length + ' pack(s) pendente(s)', true), metric('Em atraso', String(late.length), late.length ? 'Requer acompanhamento' : 'Sem atrasos')])); root.push(el('div', { className: 'section-heading' }, [el('h2', { text: 'Pagamentos pendentes' })])); const pendingList = card([], 'list').firstChild; if (pending.length) pending.forEach(function (item) { const side = el('div', { className: 'list-side' }, [el('span', { className: 'amount', text: euro(item.valorPendente) }), el('span', { className: 'badge warn', text: item.diaPagamento ? 'Dia ' + item.diaPagamento : 'Dia por definir' })]); pendingList.append(listRow(item.nome, 'Pack do mês atual', side, function () { openClient(item.idCliente); })); }); else pendingList.append(el('p', { className: 'empty', text: 'Não existem pagamentos pendentes este mês.' })); root.push(el('section', { className: 'card list' }, [pendingList])); root.push(el('div', { className: 'section-heading' }, [el('h2', { text: 'Check-ins de hoje' })])); const checkinList = card([], 'list').firstChild; const checked = state.checkins && state.checkins.comCheckin || []; if (checked.length) checked.slice(0, 8).forEach(function (item) { checkinList.append(listRow(item.nome, 'Check-in preenchido', el('div', { className: 'list-side' }, [el('span', { className: 'badge safe', text: 'Recebido' })]))); }); else checkinList.append(el('p', { className: 'empty', text: 'Ainda não há check-ins de clientes hoje.' })); root.push(el('section', { className: 'card list' }, [checkinList])); setContent(root); }
    async function runSystemCheck(control) { const input = document.getElementById('systemCheckEmail'); const email = String(input && input.value || '').trim().toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { status('Indica o email da conta de aluno usada para o teste.', 'error'); if (input) input.focus(); return; } control.disabled = true; control.textContent = 'A verificar…'; status('A verificar HMAC, isolamento e backups…'); try { const token = await window.AlMoveFirebaseAuth.token(true); const response = await fetch('/api/dev-crm-ops?clientEmail=' + encodeURIComponent(email), { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store', credentials: 'same-origin' }); const data = await response.json(); if (!response.ok || !data || !data.checks) throw new Error(data && (data.erro || data.error) || 'DIAGNOSTICO_INDISPONIVEL'); const checks = data.checks; const backups = data.backups || {}; const results = [checks.hmacVerified ? 'HMAC validado' : 'HMAC por corrigir', checks.clientMappingVerified ? 'Aluno associado' : 'Email sem associação única no Apps Script', checks.isolationVerified ? 'Isolamento validado' : 'Isolamento por corrigir', backups.dailyConfigured ? 'Backup diário ativo' : backups.reachable ? 'Backup diário por configurar' : 'Backups sem acesso']; status(results.join(' · '), data.ok && backups.dailyConfigured ? 'ok' : 'error'); } catch (error) { status(error.message === 'FIREBASE_TOKEN_INVALIDO' ? 'A sessão expirou. Termina e volta a entrar na App Coach.' : 'Não foi possível executar o diagnóstico.', 'error'); } finally { control.disabled = false; control.textContent = 'Verificar sistema'; } }
    function renderProfile() { const root = [title('PERFIL', 'Área do Coach', 'Acesso seguro da equipa.'), buildStatus()]; const identity = card([el('div', { className: 'profile-hero' }, [el('div', { className: 'avatar', text: initials(state.context.email) }), el('div', {}, [el('strong', { text: 'André Martins' }), el('span', { text: state.context.email || '' })])])]); root.push(identity); const checkEmail = el('input', { id: 'systemCheckEmail', type: 'email', placeholder: 'Email do aluno de teste', autocomplete: 'off', maxlength: '200' }); const checkButton = button('Verificar sistema', { full: true, kind: 'secondary' }); checkButton.addEventListener('click', function () { runSystemCheck(checkButton); }); root.push(card([el('p', { className: 'eyebrow', text: 'ESTABILIDADE' }), el('h2', { text: 'Diagnóstico protegido' }), el('p', { className: 'subtitle', text: 'Valida a ligação ao Portal, o isolamento entre alunos e o estado dos backups sem alterar dados.' }), field('Email do aluno de teste', checkEmail), checkButton])); const actions = card([button('Abrir CRM completo', { full: true, kind: 'secondary', action: function () { location.href = '/coach-firebase.html'; } }), button('Terminar sessão', { full: true, kind: 'danger', action: async function () { await window.AlMoveSessaoCRM.sair(); location.replace('/dev-crm.html'); } })]); actions.firstChild.style.display = 'grid'; actions.firstChild.style.gap = '10px'; root.push(actions); root.push(el('p', { className: 'subtitle', text: 'A App Coach não guarda dados de clientes no dispositivo. Os dados operacionais são pedidos ao Firebase quando precisas deles.' })); setContent(root); }
    async function refreshAgenda() { try { await loadAgenda(); if (state.view === 'agenda') renderAgenda(); } catch (error) { status(error.message, 'error'); } }
    async function refreshAll() { if (state.loading) return; state.loading = true; const control = document.getElementById('refreshButton'); if (control) control.disabled = true; try { await Promise.all([loadDashboard(), loadAgenda(), loadCheckins()]); renderCurrent(); if (document.getElementById('status')) status('Dados atualizados.', 'ok'); } catch (error) { renderCurrent(); if (document.getElementById('status')) status(error.message || 'Não foi possível atualizar os dados.', 'error'); } finally { state.loading = false; if (control) control.disabled = false; } }
    function renderCurrent() { if (state.view === 'home') return renderHome(); if (state.view === 'agenda') return renderAgenda(); if (state.view === 'pt-month') return renderPTMonth(); if (state.view === 'clients') return renderClients(); if (state.view === 'alerts') return renderAlerts(); if (state.view === 'profile') return renderProfile(); if (state.view === 'client') return renderClient(); if (state.view === 'plan-version') return renderPlanVersion(); if (state.view === 'session') return renderSession(); renderHome(); }
    function switchView(view) { if (state.view === 'session' && view !== 'session' && !confirm('Tens uma sessão por guardar. Queres sair?')) return; if (state.view === 'session') state.session = null; state.view = view; document.querySelectorAll('.nav-button').forEach(function (node) { node.classList.toggle('active', node.dataset.view === view); }); renderCurrent(); }
    function setupNavigation() { document.querySelectorAll('.nav-button').forEach(function (node) { node.addEventListener('click', function () { switchView(node.dataset.view); }); }); document.getElementById('refreshButton').addEventListener('click', refreshAll); window.addEventListener('online', function () { if (state.session) { state.session.saveState = 'pending'; updateSessionSummary(); } if (document.getElementById('status')) status('Ligação restabelecida. A sessão continua por guardar.', 'ok'); }); window.addEventListener('offline', function () { if (state.session) { state.session.saveState = 'offline'; updateSessionSummary(); } if (document.getElementById('status')) status('Sem ligação. A sessão mantém-se aberta, mas não pode ser guardada.', 'error'); }); window.setInterval(updateSessionSummary, 1000); }
    async function boot() { try { const config = await window.ALMOVE_FIREBASE_CONFIG.obter(); await window.AlMoveFirebaseAuth.configurar(config); state.context = await window.AlMoveSessaoCRM.obterContexto(); if (!state.context) throw new Error('ACESSO_RECUSADO'); const requested = new URLSearchParams(location.search).get('view'); if (['agenda', 'clients', 'alerts', 'profile'].includes(requested)) state.view = requested; await Promise.all([loadDashboard(), loadAgenda(), loadCheckins()]); setupNavigation(); document.querySelectorAll('.nav-button').forEach(function (node) { node.classList.toggle('active', node.dataset.view === state.view); }); renderCurrent(); if ('serviceWorker' in navigator) navigator.serviceWorker.register('/coach-mobile-sw.js', { scope: '/' }).catch(function () {}); } catch (error) { location.replace('/dev-crm.html?next=' + encodeURIComponent('/coach-mobile.html')); } }
    boot();
  })();
