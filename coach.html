<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>André Martins - Personal Trainer</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07111f;color:#f4fbff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#164e7c,#07111f 60%);min-height:100vh}.shell{max-width:900px;margin:auto;padding:28px 18px 70px}.topo{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24445b;padding-bottom:20px;margin-bottom:28px}.marca{font-weight:900;letter-spacing:.04em}.marca small{display:block;color:#8eaabd;font-size:11px;margin-top:4px}.botao{min-height:42px;border:0;border-radius:10px;padding:0 15px;font-weight:800;cursor:pointer;background:#2dd4bf;color:#03201e}.botao.sec{background:#132a3a;color:#d6e7f3;border:1px solid #31536a}.grid{display:grid;grid-template-columns:1fr .8fr;gap:18px}.card{background:#091827e8;border:1px solid #29516c;border-radius:18px;padding:22px}.card h1{font-size:24px;margin:0 0 6px}.card h2{font-size:16px;margin:0 0 16px}.muted{color:#9bb2c4;line-height:1.5}.numero{font-size:38px;font-weight:800;color:#5eead4;margin-top:10px}label{display:grid;gap:6px;font-size:13px;font-weight:700;margin-top:12px}input{min-height:43px;border:1px solid #345269;border-radius:9px;background:#0d2233;color:#fff;padding:0 11px;font:inherit}.lista{margin-top:24px}.cliente{padding:14px 0;border-top:1px solid #203c50;display:flex;justify-content:space-between;gap:12px}.cliente strong{display:block}.cliente span{color:#9bb2c4;font-size:14px}.estado{min-height:24px;margin:16px 0;font-size:14px}.erro{color:#fca5a5}.oculto{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}.shell{padding-top:18px}}
  </style>
</head>
<body><main class="shell">
  <header class="topo"><div class="marca">● André Martins - Personal Trainer<small>ÁREA DO PROFESSOR · DEVELOPMENT</small></div><button id="sair" class="botao sec oculto">Sair</button></header>
  <section id="login" class="card" style="max-width:440px;margin:auto"><h1>Área do professor</h1><p class="muted">Ambiente de desenvolvimento. Clientes e acessos reais não são alterados.</p><form id="formLogin"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required></label><button class="botao" style="width:100%;margin-top:20px">Entrar</button></form><p id="estadoLogin" class="estado"></p></section>
  <section id="app" class="oculto"><div class="grid"><article class="card"><h1>Clientes</h1><p class="muted">Registo central do CRM.</p><div id="total" class="numero">—</div></article><article class="card"><h2>Adicionar cliente</h2><form id="formCliente"><label>Nome<input id="nome" maxlength="120" required></label><label>Email<input id="clienteEmail" type="email" maxlength="254" required></label><label>Telemóvel <span class="muted">opcional</span><input id="telefone" maxlength="32"></label><button class="botao" style="width:100%;margin-top:18px">Guardar cliente</button></form><p id="estadoCliente" class="estado"></p></article></div><article class="card lista"><h2>Clientes registados</h2><div id="lista"><p class="muted">A carregar…</p></div></article></section>
</main>
<script src="/js/firebase-config.js"></script><script src="/js/firebase-sdk.js"></script><script src="/js/firebase-auth.js"></script>
<script>
  const login=document.querySelector('#login'), app=document.querySelector('#app'), estadoLogin=document.querySelector('#estadoLogin'), estadoCliente=document.querySelector('#estadoCliente'), lista=document.querySelector('#lista'), total=document.querySelector('#total');
  async function pedido(url, opcoes={}){const token=await window.AlMoveFirebaseAuth.token();const resposta=await fetch(url,{...opcoes,headers:{...(opcoes.headers||{}),Authorization:'Bearer '+token},cache:'no-store'});const dados=await resposta.json();if(!resposta.ok||!dados.ok)throw new Error(dados.erro||'Não foi possível concluir.');return dados}
  function renderizar(clientes){total.textContent=clientes.length;lista.replaceChildren();if(!clientes.length){lista.innerHTML='<p class="muted">Ainda não há clientes neste ambiente.</p>';return}for(const cliente of clientes){const linha=document.createElement('div');linha.className='cliente';const esquerda=document.createElement('div');const nome=document.createElement('strong');nome.textContent=cliente.nome;const email=document.createElement('span');email.textContent=cliente.email;esquerda.append(nome,email);const telefone=document.createElement('span');telefone.textContent=cliente.telefone||'—';linha.append(esquerda,telefone);lista.append(linha)}}
  async function carregar(){const dados=await pedido('/api/dev-crm-clients');renderizar(dados.clientes)}
  async function iniciar(){const config=await window.ALMOVE_FIREBASE_CONFIG.obter();await window.AlMoveFirebaseAuth.configurar(config);if(!window.AlMoveFirebaseAuth.utilizador())return;await carregar();login.classList.add('oculto');app.classList.remove('oculto');document.querySelector('#sair').classList.remove('oculto')}
  document.querySelector('#formLogin').addEventListener('submit',async event=>{event.preventDefault();estadoLogin.className='estado';estadoLogin.textContent='A entrar…';try{await iniciar();if(!window.AlMoveFirebaseAuth.utilizador())await window.AlMoveFirebaseAuth.entrar(email.value,password.value);await carregar();login.classList.add('oculto');app.classList.remove('oculto');document.querySelector('#sair').classList.remove('oculto')}catch(erro){estadoLogin.className='estado erro';estadoLogin.textContent=erro.message||'Acesso recusado.'}});
  document.querySelector('#formCliente').addEventListener('submit',async event=>{event.preventDefault();estadoCliente.className='estado';estadoCliente.textContent='A guardar…';try{await pedido('/api/dev-crm-clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome.value,email:clienteEmail.value,telefone:telefone.value})});event.target.reset();estadoCliente.textContent='Cliente guardado.';await carregar()}catch(erro){estadoCliente.className='estado erro';estadoCliente.textContent=erro.message||'Não foi possível guardar.'}});
  document.querySelector('#sair').addEventListener('click',async()=>{await window.AlMoveFirebaseAuth.sair();location.reload()});iniciar().catch(()=>{});
</script></body></html>
