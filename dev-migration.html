<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>AL MOVE — migração Development</title>
<script src="/js/firebase-config.js"></script><script src="/js/firebase-sdk.js"></script><script src="/js/firebase-auth.js"></script>
<body><main><h1>Preparação da cópia de teste</h1><p id="estado">A autenticar…</p><button id="copiar" hidden>Copiar para Firebase Development</button></main><script>
let token='';const e=document.querySelector('#estado'),b=document.querySelector('#copiar');(async()=>{try{const c=await ALMOVE_FIREBASE_CONFIG.obter();await AlMoveFirebaseAuth.configurar(c);token=await AlMoveFirebaseAuth.token();if(!token)throw Error('Entra primeiro em dev-crm.html.');const r=await fetch('/api/dev-crm-migration',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Não foi possível validar a origem.');const x=d.resumo;e.textContent=`Origem validada: ${x.clientes.total} clientes, ${x.registos.packsAtivos} packs, ${x.registos.sessoes} sessões, ${x.registos.checkins} check-ins e ${x.registos.avaliacoes} avaliações.`;b.hidden=false}catch(a){e.textContent=a.message||'Não foi possível validar.'}})();b.onclick=async()=>{b.disabled=true;e.textContent='A copiar para Firebase Development…';try{const r=await fetch('/api/dev-crm-migration',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Não foi possível copiar.');e.textContent=`Cópia de teste concluída: ${d.copied} registos no Firebase Development.`;b.hidden=true}catch(a){e.textContent=a.message||'Não foi possível copiar.';b.disabled=false}};
</script></body>
