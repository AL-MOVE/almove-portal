<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>André Martins - Personal Trainer — migração Development</title>
<script src="/js/firebase-config.js"></script>
<script src="/js/firebase-sdk.js"></script>
<script src="/js/firebase-auth.js"></script>
<body>
  <main>
    <h1>Preparação da cópia de teste</h1>
    <p id="estado" role="status">A autenticar…</p>
    <section id="detalhe" hidden aria-live="polite"></section>
    <button id="copiar" type="button" hidden>Copiar para Firebase Development</button>
  </main>
  <script>
    const estado = document.querySelector('#estado');
    const detalhe = document.querySelector('#detalhe');
    const copiar = document.querySelector('#copiar');
    let token = '';

    const camposParidade = [
      ['clientes', 'Clientes', resumo => resumo.clientes.total],
      ['packs', 'Packs ativos', resumo => resumo.registos.packsAtivos],
      ['packsHistorico', 'Packs históricos', resumo => resumo.registos.packsHistorico || 0],
      ['sessoes', 'Sessões', resumo => resumo.registos.sessoes],
      ['checkins', 'Check-ins', resumo => resumo.registos.checkins],
      ['avaliacoes', 'Avaliações', resumo => resumo.registos.avaliacoes],
      ['notas', 'Notas', resumo => resumo.registos.notas || 0],
      ['planos', 'Planos de treino', resumo => resumo.registos.planos || 0],
      ['sessoesPt', 'Sessões PT', resumo => resumo.registos.sessoesPt || 0],
      ['execucoesTreino', 'Execuções de treino', resumo => resumo.registos.execucoesTreino || 0],
      ['posTreino', 'Registos pós-treino', resumo => resumo.registos.posTreino || 0],
      ['catalogoPacotesEspeciais', 'Catálogo de pacotes especiais', resumo => resumo.registos.catalogoPacotesEspeciais || 0],
      ['pacotesEspeciais', 'Pacotes especiais', resumo => resumo.registos.pacotesEspeciais || 0],
      ['pedidosAvaliacao', 'Pedidos de avaliação', resumo => resumo.registos.pedidosAvaliacao || 0],
      ['agendaPortal', 'Agenda do portal', resumo => resumo.registos.agendaPortal || 0]
    ];

    function mostrarParidade(origem, importado, development, destino) {
      const linhas = camposParidade.map(([chave, nome, obterOrigem]) => {
        const esperado = Number(obterOrigem(origem) || 0);
        const copiado = Number(importado[chave] || 0);
        const criadoNoDevelopment = Number(development[chave] || 0);
        const total = Number(destino[chave] || 0);
        const estadoLinha = esperado !== copiado ? 'Por reconciliar' : criadoNoDevelopment ? 'Origem confirmada + Development' : 'Confirmado';
        return `<tr><th scope="row">${nome}</th><td>${esperado}</td><td>${copiado}</td><td>${criadoNoDevelopment}</td><td>${total}</td><td>${estadoLinha}</td></tr>`;
      }).join('');
      detalhe.innerHTML = `<h2>Verificação de paridade</h2><p>A coluna “Cópia da origem” é a referência para a paridade. Registos criados no Development são mantidos separadamente.</p><table><thead><tr><th>Dados</th><th>Origem</th><th>Cópia da origem</th><th>Criado no Development</th><th>Total no Development</th><th>Estado</th></tr></thead><tbody>${linhas}</tbody></table>`;
      detalhe.hidden = false;
    }

    function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function obterTokenDaSessao(atualizar) {
      for (let tentativa = 0; tentativa < 40; tentativa += 1) {
        const atual = await AlMoveFirebaseAuth.token(Boolean(atualizar));
        if (atual) return atual;
        await esperar(250);
      }
      throw new Error('Entra primeiro em dev-crm.html.');
    }

    async function preparar() {
      try {
        const configuracao = await ALMOVE_FIREBASE_CONFIG.obter();
        await AlMoveFirebaseAuth.configurar(configuracao);
        token = await obterTokenDaSessao();

        const resposta = await fetch('/api/dev-crm-migration?verify=1', {
          headers: { Authorization: 'Bearer ' + token },
          cache: 'no-store'
        });
        const dados = await resposta.json();
        if (!resposta.ok || !dados.ok) throw new Error(dados.erro || 'Não foi possível validar a origem.');

        const origem = dados.resumo;
        mostrarParidade(origem, dados.importado || {}, dados.development || {}, dados.destino || {});
        if (dados.paridade) {
          estado.textContent = `Paridade confirmada: ${dados.destino.clientes} clientes, ${dados.destino.packs} packs ativos, ${dados.destino.packsHistorico} packs históricos, ${dados.destino.sessoes} sessões, ${dados.destino.checkins} check-ins, ${dados.destino.avaliacoes} avaliações, ${dados.destino.notas} notas, ${dados.destino.planos} planos de treino e ${dados.destino.pacotesEspeciais} pacotes especiais no Firebase Development.`;
          copiar.textContent = 'Atualizar cópia Development';
        } else {
          estado.textContent = `Origem validada: ${origem.clientes.total} clientes, ${origem.registos.packsAtivos} packs ativos, ${Number(origem.registos.packsHistorico || 0)} packs históricos, ${origem.registos.sessoes} sessões, ${origem.registos.checkins} check-ins, ${origem.registos.avaliacoes} avaliações, ${Number(origem.registos.notas || 0)} notas, ${Number(origem.registos.planos || 0)} planos de treino e ${Number(origem.registos.pacotesEspeciais || 0)} pacotes especiais.`;
          copiar.textContent = 'Copiar para Firebase Development';
        }
        copiar.hidden = false;
      } catch (erro) {
        estado.textContent = erro.message || 'Não foi possível validar.';
      }
    }

    copiar.addEventListener('click', async function () {
      copiar.disabled = true;
      estado.textContent = 'A copiar para Firebase Development…';
      try {
        token = await obterTokenDaSessao(true);
        const resposta = await fetch('/api/dev-crm-migration', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token }
        });
        const dados = await resposta.json();
        if (!resposta.ok || !dados.ok) throw new Error(dados.erro || 'Não foi possível copiar.');
        const removidos = Number(dados.removed || 0);
        estado.textContent = removidos
          ? `Cópia concluída: ${dados.copied} registos atualizados e ${removidos} registos obsoletos removidos no Firebase Development.`
          : `Cópia concluída: ${dados.copied} registos no Firebase Development.`;
        copiar.textContent = 'Atualizar cópia Development';
        copiar.disabled = false;
      } catch (erro) {
        estado.textContent = erro.message || 'Não foi possível copiar.';
        copiar.disabled = false;
      }
    });

    preparar();
  </script>
</body>
