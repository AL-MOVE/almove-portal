<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>AL MOVE — migração Development</title>
<script src="/js/firebase-config.js"></script>
<script src="/js/firebase-sdk.js"></script>
<script src="/js/firebase-auth.js"></script>
<body>
  <main>
    <h1>Preparação da cópia de teste</h1>
    <p id="estado" role="status">A autenticar…</p>
    <button id="copiar" type="button" hidden>Copiar para Firebase Development</button>
  </main>
  <script>
    const estado = document.querySelector('#estado');
    const copiar = document.querySelector('#copiar');
    let token = '';

    function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function obterTokenDaSessao() {
      for (let tentativa = 0; tentativa < 40; tentativa += 1) {
        const atual = await AlMoveFirebaseAuth.token();
        if (atual) return atual;
        await esperar(250);
      }
      throw new Error('Entra primeiro em dev-crm.html.');
    }

    async function preparar() {
      try {
        const configuracao = await ALMOVE_FIREBASE_CONFIG.obter();
        await AlMoveFirebaseAuth.configurar(configuracao);
        token = await obterTokenDaSessao();

        const resposta = await fetch('/api/dev-crm-migration?verify=1', {
          headers: { Authorization: 'Bearer ' + token },
          cache: 'no-store'
        });
        const dados = await resposta.json();
        if (!resposta.ok || !dados.ok) throw new Error(dados.erro || 'Não foi possível validar a origem.');

        const origem = dados.resumo;
        if (dados.paridade) {
          estado.textContent = `Paridade confirmada: ${dados.destino.clientes} clientes, ${dados.destino.packs} packs, ${dados.destino.sessoes} sessões, ${dados.destino.checkins} check-ins, ${dados.destino.avaliacoes} avaliações, ${dados.destino.notas} notas e ${dados.destino.planos} planos de treino no Firebase Development.`;
          copiar.textContent = 'Atualizar cópia Development';
        } else {
          estado.textContent = `Origem validada: ${origem.clientes.total} clientes, ${origem.registos.packsAtivos} packs, ${origem.registos.sessoes} sessões, ${origem.registos.checkins} check-ins, ${origem.registos.avaliacoes} avaliações, ${origem.registos.notas} notas e ${origem.registos.planos} planos de treino.`;
          copiar.textContent = 'Copiar para Firebase Development';
        }
        copiar.hidden = false;
      } catch (erro) {
        estado.textContent = erro.message || 'Não foi possível validar.';
      }
    }

    copiar.addEventListener('click', async function () {
      copiar.disabled = true;
      estado.textContent = 'A copiar para Firebase Development…';
      try {
        if (!token) token = await obterTokenDaSessao();
        const resposta = await fetch('/api/dev-crm-migration', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token }
        });
        const dados = await resposta.json();
        if (!resposta.ok || !dados.ok) throw new Error(dados.erro || 'Não foi possível copiar.');
        estado.textContent = `Cópia concluída: ${dados.copied} registos no Firebase Development.`;
        copiar.textContent = 'Atualizar cópia Development';
        copiar.disabled = false;
      } catch (erro) {
        estado.textContent = erro.message || 'Não foi possível copiar.';
        copiar.disabled = false;
      }
    });

    preparar();
  </script>
</body>
