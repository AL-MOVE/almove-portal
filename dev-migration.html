<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>AL MOVE — migração Development</title>
<script src="/js/firebase-config.js"></script><script src="/js/firebase-sdk.js"></script><script src="/js/firebase-auth.js"></script>
<body><main><h1>Preparação da cópia de teste</h1><p id="estado">A autenticar…</p></main><script>
(async()=>{const e=document.querySelector('#estado');try{const c=await ALMOVE_FIREBASE_CONFIG.obter();await AlMoveFirebaseAuth.configurar(c);const t=await AlMoveFirebaseAuth.token();if(!t)throw Error('Entra primeiro em dev-crm.html.');const r=await fetch('/api/dev-crm-migration',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Não foi possível validar a origem.');const x=d.resumo;e.textContent=`Origem validada: ${x.clientes.total} clientes, ${x.registos.packsAtivos} packs, ${x.registos.sessoes} sessões, ${x.registos.checkins} check-ins e ${x.registos.avaliacoes} avaliações. Pronto para a cópia de teste.`}catch(a){e.textContent=a.message||'Não foi possível validar.'}})();
</script></body>
