<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL MOVE — Transferência</title><style>body{margin:0;background:#07111d;color:#eef6ff;font:16px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{max-width:520px;padding:32px;border:1px solid #23506c;border-radius:20px;background:#0b1c2d}h1{margin-top:0}p{color:#b6c8d9;line-height:1.5}button{border:0;border-radius:12px;padding:14px 20px;background:#00b9c2;color:#00131d;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.ok{color:#58e2ba}.error{color:#ff9fa8}</style></head><body><main class="card"><h1>Passar dados para produção</h1><p>Esta ação copia os alunos, sessões, planos, pagamentos e restantes dados deste ambiente de teste para o CRM de produção. Não apaga os dados de teste.</p><p id="status">A confirmar a sessão…</p><button id="transferir" disabled>Transferir dados agora</button></main><script src="/js/firebase-config.js"></script><script src="/js/firebase-sdk.js"></script><script src="/js/firebase-auth.js"></script><script>const status=document.querySelector('#status'),botao=document.querySelector('#transferir');(async()=>{try{const config=await ALMOVE_FIREBASE_CONFIG.obter();const user=await AlMoveFirebaseAuth.configurar(config);if(!user){status.textContent='Inicia sessão primeiro no CRM de teste e volta a esta página.';return}status.textContent='Sessão ativa: '+user.email;botao.disabled=false;botao.onclick=async()=>{botao.disabled=true;status.textContent='A transferir dados…';try{const token=await AlMoveFirebaseAuth.token(true);const resposta=await fetch('/api/transfer-development-data',{method:'POST',headers:{Authorization:'Bearer '+token}});const dados=await resposta.json();if(!resposta.ok||!dados.ok)throw Error();status.className='ok';status.textContent='Concluído: '+dados.documents+' registos em '+dados.collections+' coleções foram copiados.'}catch{status.className='error';status.textContent='Não foi possível concluir. Não alteres dados e avisa-me.'}finally{botao.disabled=false}}}catch{status.className='error';status.textContent='Não foi possível confirmar a configuração deste ambiente.'}})();</script></body></html>
